# High-resolution variant of baseline.yaml: 128^3 @ 1.5 mm.
#
# docs/project-notes/05 ranks this the single largest available win (-0.02 to -0.05 expected) and rules it
# unreachable at 2.4 R on CPU. It is reachable on a rented GPU; docs/project-notes/07 records the compliance
# ruling that permits one and the conditions attached to it.
#
# ONLY the geometry and the dataloader worker count differ from baseline.yaml. Batch size stays
# at 8 even though an A100 would take far more, because raising it changes the effective
# learning rate and would confound the resolution change with an optimisation change. The
# comparison against run 1 is the whole point of this config; keep it clean.

run_name: highres
seed: 42
output_dir: models

data:
  root: data/raw
  labels_csv: data/raw/train_labels.csv
  nifti_dir: data/raw/niftis
  folds_csv: data/interim/folds.csv
  # 2.37x the voxels of baseline. The preprocessing cache is keyed on these settings, so this
  # run builds its own cache and does not disturb the 96^3 one.
  target_spacing_mm: [1.5, 1.5, 1.5]
  target_shape: [128, 128, 128]
  normalization: reference_region
  crop: com
  cache_dir: data/processed/cache

model:
  name: resnet3d
  widths: [16, 32, 64, 128]
  dropout: 0.3
  in_channels: 1

train:
  epochs: 30
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 2
  amp: true
  grad_clip: 1.0
  # Effectively off, and deliberately so on a GPU.
  #
  # Early stopping exists to save CPU nights. On an A100 a fold is minutes, so it buys nothing
  # and costs something real: `_make_scheduler` sets `T_max = epochs`, so a fold that stops at
  # 20 of 30 selects weights trained at a rate still well above the annealed one, and never
  # gets the low-rate endgame the cosine schedule was written to provide. Run 1 is suspected of
  # exactly this, but its curve was never persisted, so it cannot be checked.
  #
  # Nothing is risked by removing it: `train_fold` already restores `best_state`, the epoch
  # with the lowest validation log loss. Training past that point costs GPU minutes and cannot
  # make the shipped weights worse.
  #
  # The run now records `history_fold*.json` and a `schedule` block in `metrics.json`, and
  # `04_evaluate.py` reports `lr at best / peak`. Read that before choosing this value again.
  early_stopping_patience: 999
  # Raised from 4: on a 24-vCPU cloud box the first epoch is cache-build bound, and
  # preprocessing at 1.5 mm resamples 2.37x the voxels of the baseline.
  num_workers: 12
  fold_column: fold_strat
  folds: [0, 1, 2, 3, 4]

aug:
  flip_lr: false
  rotate_degrees: 10.0
  translate_mm: 5.0
  scale_range: [0.9, 1.1]
  intensity_jitter: 0.1
  noise_std: 0.01
  mixup_alpha: 0.0
