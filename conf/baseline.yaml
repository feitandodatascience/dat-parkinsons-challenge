# Baseline: the smallest thing that produces a valid, calibrated submission.
# Goal is not a good score. Goal is a complete loop: train -> OOF -> calibrate -> zip -> smoke
# test -> leaderboard. Do this first, on day one. Everything after is an improvement on a
# working system rather than a gamble.

run_name: baseline
seed: 42
output_dir: models

data:
  root: data/raw
  labels_csv: data/raw/train_labels.csv
  nifti_dir: data/raw/niftis
  folds_csv: data/interim/folds.csv
  target_spacing_mm: [2.0, 2.0, 2.0]
  target_shape: [96, 96, 96]
  normalization: reference_region
  # com, not center. EDA (reports/eda/shared/) shows the field of view spans 176-630 mm per
  # axis - a 3.6x range - so the head sits in a very different part of the array depending on
  # the centre. A geometric centre crop would clip the striatum on one side for the wide-field
  # acquisitions, destroying exactly the asymmetry the task depends on.
  crop: com
  cache_dir: data/processed/cache

model:
  name: resnet3d
  widths: [16, 32, 64, 128]
  dropout: 0.3
  in_channels: 1

train:
  epochs: 30
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 2
  amp: true
  grad_clip: 1.0
  early_stopping_patience: 8
  num_workers: 4
  fold_column: fold_strat
  folds: [0, 1, 2, 3, 4]

aug:
  # flip_lr stays false: DaT abnormality is often asymmetric and laterality may be signal.
  # Run one experiment with it true before deciding.
  flip_lr: false
  rotate_degrees: 10.0
  translate_mm: 5.0
  scale_range: [0.9, 1.1]
  intensity_jitter: 0.1
  noise_std: 0.01
  mixup_alpha: 0.0
