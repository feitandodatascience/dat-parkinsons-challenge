[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datpd"
version = "0.1.0"
description = "DrivenData DaT Parkinson's Challenge - DaT SPECT normal/abnormal classification"
readme = "README.md"
license = { text = "MIT" }
# Pinned to match the competition execution runtime. Do not develop on a different minor
# version: a solution that only runs on 3.13 cannot be submitted.
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "nibabel",
    "simpleitk",
    "torch",
    "torchio",
    "monai",
    "pyyaml",
    "loguru",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
